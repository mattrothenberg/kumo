# Kumo CI/CD Pipeline
stages:
  - build
  - checks
  - test
  - review
  - beta-release
  - production-release

variables:
  PNPM_VERSION: &PNPM_VERSION "latest-10"
  NODE_VERSION: &NODE_VERSION "24"
  PACKAGE_NAME: "@cloudflare/kumo"

default:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.cfdata.org

# ============= BUILD STAGE (First - creates artifacts for downstream jobs) =============

include:
  # Build @cloudflare/kumo package
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/build@~latest
    inputs:
      stage: build
      jobPrefix: build-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo"
      artifactDir: "dist"
      runOnMR: true
      runOnBranches: "^main$"

  # Build @cloudflare/kumo-docs
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/build@~latest
    inputs:
      stage: build
      jobPrefix: build-kumo-docs
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo-docs"
      artifactDir: "build"
      runOnMR: true
      runOnBranches: "^main$"

  # ============= CHECKS STAGE (Runs after build, can use artifacts) =============

  # Validate lockfile integrity
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: lockfile-check
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "lockfile-check"
      runOnMR: true

  # Type checking across workspace
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: typecheck
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "typecheck"
      runOnMR: true
      runOnBranches: "^main$"

  # Linting @cloudflare/kumo
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/lint@~latest
    inputs:
      stage: checks
      jobPrefix: lint-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # Changeset validation for @cloudflare/kumo
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: validate-changeset
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "validate:changeset"
      workDir: "packages/kumo"
      runOnMR: true

  # ============= TEST STAGE (Uses build artifacts) =============

  # Test @cloudflare/kumo (unit + Storybook a11y tests)
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/test@~latest
    inputs:
      stage: test
      jobPrefix: test-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # ============= BETA RELEASE STAGE (Publishes beta versions to npm) =============

  # Beta release using pnpm component
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: beta-release
      jobPrefix: publish-beta
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "publish:beta"
      runOnMR: true

  # ============= PRODUCTION RELEASE STAGE (Publishes production versions to npm) =============

  # Production release using pnpm component
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: production-release
      jobPrefix: prod-release-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "release:production"
      runOnMR: false
      runOnBranches: "never"
  # ============= REVIEW STAGE (AI-powered code review) =============

  # Claude Code Review
  # DevTools docs -> https://gitlab.cfdata.org/cloudflare/ci/ai
  - component: $CI_SERVER_FQDN/cloudflare/ci/ai/review@~latest

# Job overrides for dependencies and additional configuration

# kumo-docs depends on kumo being built first (imports from @cloudflare/kumo)
build-kumo-docs-build:
  needs:
    - build-kumo-build

typecheck-run:
  needs:
    - build-kumo-build
    - build-kumo-docs-build

lint-kumo-lint:
  needs:
    - build-kumo-build

test-kumo-test:
  needs:
    - build-kumo-build
  before_script:
    - cd packages/kumo && pnpm exec playwright install chromium --with-deps
  # Coverage disabled temporarily - enable when test:coverage script is used
  # coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  # artifacts:
  #   reports:
  #     coverage_report:
  #       coverage_format: cobertura
  #       path: packages/kumo/coverage/cobertura-coverage.xml

publish-beta-run:
  needs:
    - job: validate-changeset-run
      optional: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo/**/*
        compare_to: "refs/heads/main"
      when: on_success
    - when: never
  secrets:
    NPM_TOKEN:
      vault: gitlab/_ci_components/_dev/npm/kv_token@kv
      file: false
    GITLAB_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/kumo_preview_bot/data@kv
      file: false

# ============= MANUAL RELEASES STAGE (Production releases) =============

# Override prod-release-kumo-run job with manual trigger and custom config
prod-release-kumo-run:
  allow_failure: false
  variables:
    PACKAGE_NAME: "@cloudflare/kumo"
    PACKAGE_PATH: "packages/kumo"
    DRY_RUN: "false" # Set to 'true' to test without publishing or pushing
  before_script:
    # Activate Node.js 24 via nvm (already installed in image at /usr/local/nvm)
    - |
      export NVM_DIR="/usr/local/nvm"
      source "$NVM_DIR/nvm.sh"
      nvm install 24
      nvm use 24
      corepack enable
      corepack prepare pnpm@latest-10 --activate
      node --version
      pnpm --version
    # Validate changesets exist before proceeding
    - |
      CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
      if [ "$CHANGESET_COUNT" -eq 0 ]; then
        echo "❌ No changesets found in .changeset/ directory"
        echo "Add changesets using 'pnpm changeset' before releasing"
        exit 1
      fi
      echo "✅ Found $CHANGESET_COUNT changeset(s) to release"
    # Install dependencies
    - pnpm install --frozen-lockfile
    # Configure git for commits
    - git config --global user.email "ci@cloudflare.com"
    - git config --global user.name "Kumo CI"
    # Configure npm registry authentication
    - |
      cat > ~/.npmrc << EOF
      @cloudflare:registry=https://registry-gateway.cloudflare-ui.workers.dev
      //registry-gateway.cloudflare-ui.workers.dev/:_authToken=${NPM_TOKEN}
      EOF
    # Set up Git remote with authentication for pushing
    - git remote set-url origin "https://ci-release-token:${CI_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "rknecht/UI-7306-production-library-deployment"'
      when: manual # Temporary: allow testing on feature branch
    - when: never
  artifacts:
    paths:
      - ${PACKAGE_PATH}/package.json
      - ${PACKAGE_PATH}/CHANGELOG.md
      - .changeset/
    expire_in: 1 week
  secrets:
    NPM_TOKEN:
      vault: gitlab/_ci_components/_dev/npm/kv_token@kv
      file: false
    GITLAB_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/kumo_preview_bot/data@kv
      file: false
    CI_RELEASE_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/ci_release_token/data@kv
      file: false
