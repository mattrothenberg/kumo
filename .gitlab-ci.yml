# Kumo CI/CD Pipeline
stages:
  - build
  - checks
  - test
  - review
  - beta-release
  - beta-preview
  - mr-report
  - production-release

variables:
  PNPM_VERSION: &PNPM_VERSION "latest-10"
  NODE_VERSION: &NODE_VERSION "24"
  PACKAGE_NAME: "@cloudflare/kumo"

default:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.cfdata.org

# ============= BUILD STAGE (First - creates artifacts for downstream jobs) =============

include:
  # Build @cloudflare/kumo package
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/build@~latest
    inputs:
      stage: build
      jobPrefix: build-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo"
      artifactDir: "dist"
      runOnMR: true
      runOnBranches: "^main$"

  # Build @cloudflare/kumo-docs
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/build@~latest
    inputs:
      stage: build
      jobPrefix: build-kumo-docs
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo-docs"
      artifactDir: "build"
      runOnMR: true
      runOnBranches: "^main$"

  # Build @cloudflare/kumo-docs-astro
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/build@~latest
    inputs:
      stage: build
      jobPrefix: build-kumo-docs-astro
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo-docs-astro"
      artifactDir: "dist"
      runOnMR: true
      runOnBranches: "^main$"

  # ============= CHECKS STAGE (Runs after build, can use artifacts) =============

  # Validate lockfile integrity
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: lockfile-check
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "lockfile-check"
      runOnMR: true

  # Type checking across workspace
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: typecheck
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "typecheck"
      runOnMR: true
      runOnBranches: "^main$"

  # Linting @cloudflare/kumo
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/lint@~latest
    inputs:
      stage: checks
      jobPrefix: lint-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # Validate @cloudflare/kumo build output (primitives, exports, bundling)
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: validate-build
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "validate:build"
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # Changeset validation for @cloudflare/kumo
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: validate-changeset
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "validate:changeset"
      workDir: "packages/kumo"
      runOnMR: true

  # Color token validation for @cloudflare/kumo
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: validate-colors
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "validate:colors"
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # Figma plugin drift detection for @cloudflare/kumo
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: checks
      jobPrefix: validate-figma-sync
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "validate:figma"
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # ============= TEST STAGE (Uses build artifacts) =============

  # Test @cloudflare/kumo (unit tests + Storybook a11y tests)
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/test@~latest
    inputs:
      stage: test
      jobPrefix: test-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      workDir: "packages/kumo"
      runOnMR: true
      runOnBranches: "^main$"

  # ============= BETA RELEASE STAGE (Publishes beta versions to npm) =============

  # Beta release using pnpm component
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: beta-release
      jobPrefix: publish-beta
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "publish:beta"
      runOnMR: true

  # ============= BETA PREVIEW STAGE (Deploys Storybook preview) =============

  # Storybook preview deployment
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: beta-preview
      jobPrefix: deploy-storybook-preview
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "deploy:storybook-preview"
      runOnMR: true

  # Kumo docs preview deployment
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: beta-preview
      jobPrefix: deploy-kumo-docs-preview
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "deploy:kumo-docs-preview"
      runOnMR: true

  # Kumo docs astro preview deployment
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: beta-preview
      jobPrefix: deploy-kumo-docs-astro-preview
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "deploy:kumo-docs-astro-preview"
      runOnMR: true

  # ============= MR REPORT STAGE (Posts consolidated MR comment) =============

  # MR report collection and posting
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: mr-report
      jobPrefix: post-mr-report
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "ci:post-mr-report"
      runOnMR: true

  # ============= STAGING DEPLOYMENT (Deploys Storybook to staging on main merge) =============

  # Storybook staging deployment
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: production-release
      jobPrefix: deploy-storybook-staging
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "deploy:storybook-staging"
      runOnMR: false
      runOnBranches: "^main$"

  # Kumo docs staging deployment
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: production-release
      jobPrefix: deploy-kumo-docs-staging
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "deploy:kumo-docs-staging"
      runOnMR: false
      runOnBranches: "^main$"

  # ============= PRODUCTION RELEASE STAGE (Publishes production versions to npm) =============

  # Production release using pnpm component
  - component: $CI_SERVER_FQDN/cloudflare/ci/pnpm/run@~latest
    inputs:
      stage: production-release
      jobPrefix: prod-release-kumo
      PNPM_VERSION: *PNPM_VERSION
      NODE_VERSION: *NODE_VERSION
      PNPM_RUN_TARGET: "release:production"
      runOnMR: false
      runOnBranches: "never"

  # ============= REVIEW STAGE (AI-powered code review) =============

  # Claude Code Review
  # DevTools docs -> https://gitlab.cfdata.org/cloudflare/ci/ai
  - component: $CI_SERVER_FQDN/cloudflare/ci/ai/opencode@~latest

# ============= Job overrides for dependencies and additional configuration =============

# kumo-docs depends on kumo being built first (imports from @cloudflare/kumo)
build-kumo-docs-build:
  needs:
    - build-kumo-build

# kumo-docs-astro depends on kumo being built first (imports from @cloudflare/kumo)
build-kumo-docs-astro-build:
  needs:
    - build-kumo-build

typecheck-run:
  needs:
    - build-kumo-build
    - build-kumo-docs-build

lint-kumo-lint:
  needs:
    - build-kumo-build

validate-build-run:
  needs:
    - build-kumo-build

# Color validation runs when theme CSS or component files change
validate-colors-run:
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo/src/styles/theme-*.css
          - packages/kumo/src/**/*.tsx
        compare_to: "refs/heads/main"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

# Figma sync validation runs when component registry or figma generators change
validate-figma-sync-run:
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo/ai/component-registry.json
          - packages/kumo/scripts/figma/plugin/generators/**/*
          - packages/kumo/scripts/figma/plugin/code.ts
        compare_to: "refs/heads/main"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

publish-beta-run:
  needs:
    - job: validate-changeset-run
      optional: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo/**/*
        compare_to: "refs/heads/main"
      when: on_success
    - when: never
  artifacts:
    paths:
      - ci/reports/
    expire_in: 1 day
  secrets:
    NPM_TOKEN:
      vault: gitlab/_ci_components/_dev/npm/kv_token@kv
      file: false

deploy-storybook-preview-run:
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo/**/*
        compare_to: "refs/heads/main"
      when: on_success
    - when: never
  artifacts:
    paths:
      - ci/reports/
    expire_in: 1 day
  secrets:
    CLOUDFLARE_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_api_token/data@kv
      file: false
    CLOUDFLARE_ACCOUNT_ID:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_account_id/data@kv
      file: false

deploy-kumo-docs-preview-run:
  needs:
    - job: build-kumo-build
      artifacts: true
    - job: build-kumo-docs-build
      artifacts: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo-docs/**/*
          - packages/kumo/**/*
        compare_to: "refs/heads/main"
      when: on_success
    - when: never
  artifacts:
    paths:
      - ci/reports/
    expire_in: 1 day
  secrets:
    CLOUDFLARE_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_api_token/data@kv
      file: false
    CLOUDFLARE_ACCOUNT_ID:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_account_id/data@kv
      file: false

deploy-kumo-docs-astro-preview-run:
  needs:
    - job: build-kumo-build
      artifacts: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo-docs-astro/**/*
          - packages/kumo/**/*
        compare_to: "refs/heads/main"
      when: on_success
    - when: never
  artifacts:
    paths:
      - ci/reports/
    expire_in: 1 day
  secrets:
    CLOUDFLARE_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_api_token/data@kv
      file: false
    CLOUDFLARE_ACCOUNT_ID:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_account_id/data@kv
      file: false

post-mr-report-run:
  needs:
    - job: publish-beta-run
      artifacts: true
      optional: true
    - job: deploy-storybook-preview-run
      artifacts: true
      optional: true
    - job: deploy-kumo-docs-preview-run
      artifacts: true
      optional: true
    - job: deploy-kumo-docs-astro-preview-run
      artifacts: true
      optional: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        paths:
          - packages/kumo/**/*
          - packages/kumo-docs/**/*
          - packages/kumo-docs-astro/**/*
        compare_to: "refs/heads/main"
      when: on_success
    - when: never
  secrets:
    GITLAB_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/kumo_preview_bot_v2/data@kv
      file: false

deploy-storybook-staging-run:
  secrets:
    CLOUDFLARE_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_api_token/data@kv
      file: false
    CLOUDFLARE_ACCOUNT_ID:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_account_id/data@kv
      file: false

deploy-kumo-docs-staging-run:
  needs:
    - job: build-kumo-build
      artifacts: true
    - job: build-kumo-docs-build
      artifacts: true
  secrets:
    CLOUDFLARE_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_api_token/data@kv
      file: false
    CLOUDFLARE_ACCOUNT_ID:
      vault: gitlab/cloudflare/fe/kumo/_dev/cloudflare_account_id/data@kv
      file: false

# ============= MANUAL RELEASES STAGE (Production releases) =============

# Override prod-release-kumo-run job with manual trigger and custom config
prod-release-kumo-run:
  allow_failure: false
  variables:
    PACKAGE_NAME: "@cloudflare/kumo"
    PACKAGE_PATH: "packages/kumo"
    DRY_RUN: "false" # Set to 'true' to test without publishing or pushing
  before_script:
    # Activate Node.js 24 via nvm (already installed in image at /usr/local/nvm)
    - |
      export NVM_DIR="/usr/local/nvm"
      source "$NVM_DIR/nvm.sh"
      nvm install 24
      nvm use 24
      corepack enable
      corepack prepare pnpm@latest-10 --activate
      node --version
      pnpm --version
    # Validate changesets exist before proceeding
    - |
      CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
      if [ "$CHANGESET_COUNT" -eq 0 ]; then
        echo "❌ No changesets found in .changeset/ directory"
        echo "Add changesets using 'pnpm changeset' before releasing"
        exit 1
      fi
      echo "✅ Found $CHANGESET_COUNT changeset(s) to release"
    # Install dependencies
    - pnpm install --frozen-lockfile
    # Configure git for commits
    - git config --global user.email "ci@cloudflare.com"
    - git config --global user.name "Kumo CI"
    # Configure npm registry authentication
    - |
      cat > ~/.npmrc << EOF
      @cloudflare:registry=https://registry-gateway.cloudflare-ui.workers.dev
      //registry-gateway.cloudflare-ui.workers.dev/:_authToken=${NPM_TOKEN}
      EOF
    # Set up Git remote with authentication for pushing
    - git remote set-url origin "https://ci-release-token:${CI_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "rknecht/UI-7306-production-library-deployment"'
      when: manual # Temporary: allow testing on feature branch
    - when: never
  artifacts:
    paths:
      - ${PACKAGE_PATH}/package.json
      - ${PACKAGE_PATH}/CHANGELOG.md
      - .changeset/
    expire_in: 1 week
  secrets:
    NPM_TOKEN:
      vault: gitlab/_ci_components/_dev/npm/kv_token@kv
      file: false
    GITLAB_API_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/kumo_preview_bot_v2/data@kv
      file: false
    CI_RELEASE_TOKEN:
      vault: gitlab/cloudflare/fe/kumo/_dev/ci_release_token_v2/data@kv
      file: false
