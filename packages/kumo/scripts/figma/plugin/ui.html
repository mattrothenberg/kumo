<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kumo UI Kit Generator</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        padding: 16px;
        margin: 0;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 16px 0;
      }
      p {
        font-size: 14px;
        margin: 0 0 16px 0;
        color: #666;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }
      button {
        flex: 1;
        padding: 8px 16px;
        font-size: 14px;
        border-radius: 6px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
      }
      button:hover {
        background: #f5f5f5;
      }
      button.primary {
        background: #0066ff;
        color: white;
        border-color: #0066ff;
      }
      button.primary:hover {
        background: #0052cc;
      }
    </style>
  </head>
  <body>
    <h1>Kumo UI Kit Generator</h1>
    <p>
      Generate Figma components from Kumo component definitions. This will
      destructively sync - all existing generated components will be replaced.
    </p>
    <div class="actions">
      <button id="cancel">Cancel</button>
      <button id="generate" class="primary">Generate UI Kit</button>
    </div>

    <script>
      document.getElementById("generate").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "generate" } }, "*");
      };

      document.getElementById("cancel").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
      };
    </script>
  </body>
</html>
